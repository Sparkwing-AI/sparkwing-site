name: Preview

# Deploys each pull request to a Cloudflare Pages preview. Every deployment is a preview,
# so Cloudflare serves it with X-Robots-Tag: noindex. The project's production branch is
# deliberately a branch that is never deployed, so sparkwing-site.pages.dev never mirrors the live site.

on:
  pull_request:

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PAGES_PROJECT: sparkwing-site
  PAGES_PRODUCTION_BRANCH: no-production

jobs:
  deploy:
    name: Deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Preview skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm install -g npm@11.13.0
          npm ci

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      - name: Create the Pages project if missing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if ! npx wrangler pages project list --json | grep -q "\"$PAGES_PROJECT\""; then
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch="$PAGES_PRODUCTION_BRANCH"
          fi

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$HEAD_REF" \
            --commit-hash="$HEAD_SHA" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
