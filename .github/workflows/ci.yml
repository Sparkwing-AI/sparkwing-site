name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, links, axe, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Link check
        run: npm run test:links

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe)
        run: npm run test:a11y

      - name: Lighthouse
        run: npm run test:lighthouse

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            .lighthouseci
            playwright-report
          retention-days: 14
