name = "sparkwing-leads"
account_id = "9d662527c737f4da3e868a52641e3d09"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Cloudflare Access must cover ALL traffic to this Worker (see docs/website/FORMS-SETUP.md).
# Turn off the public workers.dev and preview URLs once Access is on the Worker's own hostname.
[observability]
enabled = true

# Same database as the forms Worker.
[[d1_databases]]
binding = "DB"
database_name = "sparkwing-leads"
database_id = "bb3edd0c-0de7-4ab7-88e9-a6c625723585"
migrations_dir = "../forms/migrations"

# The chat Worker's log of masked chats and per-chat summaries. This Worker only reads it.
# Apply the chat Worker's migrations to this database before deploying (see docs/website/SPARKY-GOLIVE.md).
[[d1_databases]]
binding = "CHATLOG"
database_name = "sparkwing-chat-log"
database_id = "a08cf559-5f65-46de-8e3d-6fdf2cc6df5a"
