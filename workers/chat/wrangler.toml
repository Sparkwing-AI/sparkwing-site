name = "sparkwing-chat"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Local only. Do not deploy this origin list. Production allows https://sparkwing.com.au only.
[dev]
port = 8788

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:4321,http://localhost:4321"
CHAT_ENABLED = "true"

# Secrets stay in .dev.vars, which is gitignored:
#   ANTHROPIC_API_KEY
#   TURNSTILE_SECRET_KEY   optional locally. Required before any public origin is allowed.
