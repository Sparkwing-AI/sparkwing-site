name = "sparkwing-chat"
account_id = "9d662527c737f4da3e868a52641e3d09"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Keep variables set in the Cloudflare dashboard on every deploy. Wrangler only reads this at the top level.
keep_vars = true

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession", "ChatLimits"]

# Local development. Secrets stay in .dev.vars, which is gitignored:
#   ANTHROPIC_API_KEY
#   TURNSTILE_SECRET_KEY   optional locally. Without it, only local origins can start a chat.
[dev]
port = 8788

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:4321,http://localhost:4321"
# No CHAT_ENABLED here: missing means on. Put CHAT_ENABLED=false in .dev.vars to test the offline state.

[durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "ChatSession" },
  { name = "LIMITS", class_name = "ChatLimits" },
]

[[d1_databases]]
binding = "DB"
database_name = "sparkwing-chat-log"
database_id = "local-chat-log"
migrations_dir = "migrations"

# Deploy with: npx wrangler deploy --config workers/chat/wrangler.toml --env production
# CHAT_ENABLED is the kill switch, so it is not set here. It lives only in the Cloudflare dashboard,
# and keep_vars stops a deploy from changing it. Missing or anything but "false" means the chat is on.
[env.production]
name = "sparkwing-chat"

[env.production.vars]
ALLOWED_ORIGINS = "https://sparkwing.com.au,https://www.sparkwing.com.au"
EXPECTED_HOSTNAME = "sparkwing.com.au"
DAILY_BUDGET_USD = "1"

[env.production.durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "ChatSession" },
  { name = "LIMITS", class_name = "ChatLimits" },
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "sparkwing-chat-log"
database_id = "a08cf559-5f65-46de-8e3d-6fdf2cc6df5a"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["17 3 * * *"]
