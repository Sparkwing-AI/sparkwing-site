<style>body{margin:0}
.sw-ask-launch{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 20px 0 16px;border:none;border-radius:999px;background:var(--sw-color-violet);color:var(--sw-brand-white);font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 14px 32px rgba(12,53,47,.28)}
.sw-ask-launch:hover{background:var(--sw-color-deep)}
.sw-ask-launch:focus-visible,.sw-ask button:focus-visible,.sw-ask a:focus-visible,.sw-ask textarea:focus-visible{outline:3px solid var(--sw-color-deep);outline-offset:2px}
.sw-ask{position:fixed;right:20px;bottom:20px;z-index:40}
.sw-ask-panel{display:flex;flex-direction:column;width:min(400px,calc(100vw - 32px));height:min(640px,calc(100dvh - 40px));overflow:hidden;border:1px solid var(--sw-color-border-strong);border-radius:20px;background:var(--sw-brand-white);color:var(--sw-mock-ink-deep);box-shadow:0 24px 48px rgba(12,53,47,.22);font-family:'DM Sans',system-ui,sans-serif}
.sw-ask-head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;background:var(--sw-color-violet);color:var(--sw-brand-white)}
.sw-ask-head b{display:block;font-size:17px;line-height:1.2}.sw-ask-head span{display:block;font-size:13px;line-height:1.3}
.sw-ask-x{flex:none;margin-left:auto;width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:var(--sw-brand-white);font:inherit;font-size:24px;line-height:1;cursor:pointer}
.sw-ask-x:hover{background:rgba(255,255,255,.16)}.sw-ask-x:focus-visible{outline-color:var(--sw-brand-white)!important}
.sw-ask-log{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--sw-color-violet-tint)}
.sw-ask-m{display:flex;flex-direction:column;gap:8px;max-width:88%;align-self:flex-start;padding:11px 13px;border-radius:14px;background:var(--sw-brand-white);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.sw-ask-m.me{align-self:flex-end;background:var(--sw-color-deep);color:var(--sw-brand-white)}
.sw-ask-src{font-size:13px;color:var(--sw-color-text-muted)}.sw-ask-src a{color:var(--sw-color-link);font-weight:700}
.sw-ask-note{font-size:13px;color:var(--sw-color-text-muted)}.sw-ask-m.me .sw-ask-note{color:var(--sw-color-on-deep-muted)}
.sw-ask-act{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:999px;background:var(--sw-color-deep);color:var(--sw-brand-white);font-size:14px;font-weight:700;text-decoration:none;text-align:center}
.sw-ask-act:hover{color:var(--sw-brand-white);background:var(--sw-color-border-on-deep)}
.sw-ask-chips{display:flex;flex-wrap:wrap;gap:8px}
.sw-ask-chip{min-height:44px;padding:0 13px;border:1.5px solid var(--sw-color-violet);border-radius:999px;background:var(--sw-brand-white);color:var(--sw-color-violet);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.sw-ask-chip:hover{background:var(--sw-color-violet);color:var(--sw-brand-white)}
.sw-ask-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--sw-color-border);background:var(--sw-brand-white)}
.sw-ask-form{display:flex;align-items:flex-end;gap:8px}
.sw-ask-form textarea{flex:1 1 auto;min-width:0;min-height:44px;max-height:110px;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--sw-color-text-muted);border-radius:12px;background:var(--sw-brand-white);color:var(--sw-mock-ink-deep);font:inherit;font-size:16px;line-height:1.3;resize:none}
.sw-ask-send{flex:none;min-height:44px;padding:0 16px;border:none;border-radius:12px;background:var(--sw-color-violet);color:var(--sw-brand-white);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.sw-ask-send:hover{background:var(--sw-color-deep)}
.sw-ask-lead{max-width:100%;width:100%;box-sizing:border-box;position:relative}
.sw-ask-f{display:flex;flex-direction:column;gap:4px}.sw-ask-f label{font-size:14px;font-weight:700}
.sw-ask-f input,.sw-ask-f textarea{width:100%;min-height:44px;box-sizing:border-box;padding:9px 11px;border:1.5px solid var(--sw-color-text-muted);border-radius:10px;background:var(--sw-brand-white);color:var(--sw-mock-ink-deep);font:inherit;font-size:16px;resize:vertical}
.sw-ask-f input[aria-invalid="true"]{border-color:var(--sw-color-error)}
.sw-ask-tick{display:flex;gap:10px;align-items:flex-start;min-height:44px;font-size:13px;line-height:1.4}.sw-ask-tick input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--sw-color-deep)}.sw-ask-tick a{color:var(--sw-color-link)}
.sw-ask-fake{display:block;min-height:44px;box-sizing:border-box;padding:10px 11px;border:1.5px solid var(--sw-color-text-muted);border-radius:10px;background:var(--sw-brand-white)}.sw-ask-box{flex:none;width:22px;height:22px;box-sizing:border-box;border:1.5px solid var(--sw-color-text-muted);border-radius:4px;background:var(--sw-brand-white)}
.sw-ask-err{font-size:13px;font-weight:700;color:var(--sw-color-error)}
.sw-ask input:focus-visible{outline:3px solid var(--sw-color-deep);outline-offset:2px}
.sw-ask-legal{margin:0;font-size:12px;line-height:1.4;color:var(--sw-color-text-muted)}.sw-ask-legal a{color:var(--sw-color-link)}
.sw-ask-count{font-size:12px;color:var(--sw-color-text-muted);text-align:right}
@media (max-width:480px){.sw-ask-launch{right:12px;bottom:12px}.sw-ask{inset:0}.sw-ask-panel{width:100%;height:100dvh;border:none;border-radius:0}}
</style></helmet>
<main style="display: flex; flex-direction: column; gap: 24px; padding: 40px; background: var(--sw-color-page); font-family: var(--sw-font-sans); color: var(--sw-color-deep)">
  <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em">Ask Sparky states</h1>
  <div style="display: flex; flex-wrap: wrap; gap: 28px">
    <figure style="display: flex; flex-direction: column; gap: 10px; margin: 0"><figcaption style="font-size: 16px; font-weight: 700">Closed</figcaption><span class="sw-ask-launch" style="position: static; align-self: flex-start"><svg aria-hidden="true" width="20" height="20" viewBox="-12 -12 24 24" fill="currentColor"><path d="M0-12Q1.5-1.5 12 0Q1.5 1.5 0 12Q-1.5 1.5-12 0Q-1.5-1.5 0-12Z"></path></svg>Ask Sparky</span></figure>
    <figure style="display: flex; flex-direction: column; gap: 10px; margin: 0"><figcaption style="font-size: 16px; font-weight: 700; color: var(--sw-color-deep)">1. Welcome</figcaption><div class="sw-ask-panel" style="width: 380px; height: 600px"><div class="sw-ask-head"><svg aria-hidden="true" width="20" height="20" viewBox="-12 -12 24 24" fill="currentColor"><path d="M0-12Q1.5-1.5 12 0Q1.5 1.5 0 12Q-1.5 1.5-12 0Q-1.5-1.5 0-12Z"></path></svg><div><b>Ask Sparky</b><span>Sparkwing&#39;s AI assistant</span></div><span class="sw-ask-x" style="display: flex; align-items: center; justify-content: center">&times;</span></div><div class="sw-ask-log"><div class="sw-ask-m"><span>Hi, I&#39;m Sparky. Great to have you here! Ask me anything about Sparkwing and its apps. I can&#39;t see anyone&#39;s records or make changes.</span></div><div class="sw-ask-chips"><span class="sw-ask-chip" style="display: flex; align-items: center">What is Sparkkeeper?</span><span class="sw-ask-chip" style="display: flex; align-items: center">Is the beta free?</span><span class="sw-ask-chip" style="display: flex; align-items: center">Is my data used to train AI?</span><span class="sw-ask-chip" style="display: flex; align-items: center">Book a call</span></div></div><div class="sw-ask-foot"><div class="sw-ask-form"><div style="flex: 1; min-height: 44px; box-sizing: border-box; padding: 11px 12px; border: 1.5px solid var(--sw-color-text-muted); border-radius: 12px; color: var(--sw-color-text-muted); font-size: 15px">Ask about Sparkwing</div><span class="sw-ask-send" style="display: flex; align-items: center">Send</span></div><p class="sw-ask-legal">Sparky is AI and can make mistakes. Please keep personal, client and payment details out of your messages. <a href="#">Privacy policy</a></p></div></div></figure><figure style="display: flex; flex-direction: column; gap: 10px; margin: 0"><figcaption style="font-size: 16px; font-weight: 700; color: var(--sw-color-deep)">2. Answer, then ask</figcaption><div class="sw-ask-panel" style="width: 380px; height: 600px"><div class="sw-ask-head"><svg aria-hidden="true" width="20" height="20" viewBox="-12 -12 24 24" fill="currentColor"><path d="M0-12Q1.5-1.5 12 0Q1.5 1.5 0 12Q-1.5 1.5-12 0Q-1.5-1.5 0-12Z"></path></svg><div><b>Ask Sparky</b><span>Sparkwing&#39;s AI assistant</span></div><span class="sw-ask-x" style="display: flex; align-items: center; justify-content: center">&times;</span></div><div class="sw-ask-log"><div class="sw-ask-m me"><span>Is the beta free?</span></div><div class="sw-ask-m"><span>Good question. The beta is free for one month, with AI credits included. Seats are limited, so we review each application. What kind of business do you run, and what&#39;s eating up the most time?</span><span class="sw-ask-src">Source: <a href="#">Beta page</a></span></div></div><div class="sw-ask-foot"><div class="sw-ask-form"><div style="flex: 1; min-height: 44px; box-sizing: border-box; padding: 11px 12px; border: 1.5px solid var(--sw-color-text-muted); border-radius: 12px; color: var(--sw-color-text-muted); font-size: 15px">Ask about Sparkwing</div><span class="sw-ask-send" style="display: flex; align-items: center">Send</span></div><p class="sw-ask-legal">Sparky is AI and can make mistakes. Please keep personal, client and payment details out of your messages. <a href="#">Privacy policy</a></p></div></div></figure><figure style="display: flex; flex-direction: column; gap: 10px; margin: 0"><figcaption style="font-size: 16px; font-weight: 700; color: var(--sw-color-deep)">3. Recommend one offer</figcaption><div class="sw-ask-panel" style="width: 380px; height: 600px"><div class="sw-ask-head"><svg aria-hidden="true" width="20" height="20" viewBox="-12 -12 24 24" fill="currentColor"><path d="M0-12Q1.5-1.5 12 0Q1.5 1.5 0 12Q-1.5 1.5-12 0Q-1.5-1.5 0-12Z"></path></svg><div><b>Ask Sparky</b><span>Sparkwing&#39;s AI assistant</span></div><span class="sw-ask-x" style="display: flex; align-items: center; justify-content: center">&t
